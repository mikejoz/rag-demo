image:
  repository: ragchatdemo/mcp-server
  tag: local
  pullPolicy: IfNotPresent

service:
  port: 8080

configMapName: rag-chat-demo-config
secretName: rag-chat-demo-secrets

reranker:
  provider: Tei
  candidateCount: 20
  topN: 5
  minScore: "0.2"
  candidateMaxCosineDistance: "0.5"
  timeoutSeconds: 3
  teiBaseUrl: http://reranker:80
