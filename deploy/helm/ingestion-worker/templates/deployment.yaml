apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  labels:
    app: ingestion-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-worker
  template:
    metadata:
      labels:
        app: ingestion-worker
    spec:
      containers:
        - name: ingestion-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: postgres-password
            - name: ConnectionStrings__Postgres
              value: "Host=postgres;Port=5432;Database=ragchatdemo;Username=postgres;Password=$(POSTGRES_PASSWORD)"
            - name: Confluence__ApiToken
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: confluence-api-token
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
